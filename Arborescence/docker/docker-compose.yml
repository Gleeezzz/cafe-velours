version: '3.8'

services:
  consul:
    image: hashicorp/consul:1.15
    container_name: consul-server
    restart: always
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: "agent -dev -client=0.0.0.0"

  mysql-db:
    image: mysql:8.0
    container_name: cafe-velours-mysql
    ports:
      - "3310:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: cafe_velours_db
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cafe-velours-network

  payment-db:
    image: mysql:8.0
    container_name: payment-db
    ports:
      - "3312:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password # 💡 Changé en "password" pour s'aligner sur ton Workbench !
      MYSQL_DATABASE: payment_db
    networks:
      - cafe-velours-network

  mongodb:
    image: mongo:latest
    container_name: cafe-velours-mongo
    ports:
      - "27017:27017"

volumes:
  mysql_data:

networks:
  cafe-velours-network:
    driver: bridge