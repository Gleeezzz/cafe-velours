server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    compatibility-verifier:
      enabled: false

    consul:
      host: localhost
      port: 8500
      discovery:
        instance-id: ${spring.application.name}-v4-${random.value}
        prefer-ip-address: true  # On réactive mais...
        ip-address: 127.0.0.1    # ON FORCE LOCALHOST ICI !

    # Routage Spring Cloud Gateway (Syntaxe Webflux moderne)
    gateway:
      server:
        webflux:
          routes:
            - id: order-service-route
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**
            - id: product-service-route
              uri: lb://product-service
              predicates:
                - Path=/api/products/**