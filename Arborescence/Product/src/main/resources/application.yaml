server:
  port: 8082

spring:
  application:
    name: product-service

  # ─── COMPATIBILITÉ ET CONFIGURATION CONFIG DE BASE ───
  cloud:
    compatibility-verifier:
      enabled: false
    consul:
      host: localhost
      port: 8500
      discovery:
        instance-id: ${spring.application.name}-v4-${random.value}
        prefer-ip-address: true
        ip-address: 127.0.0.1    # ON FORCE LOCALHOST ICI !
  # ─── CONFIGURATION BASE DE DONNÉES ET JPA ───
  sql:
    init:
      mode: always
  jpa:
    defer-datasource-initialization: true
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  datasource:
    url: jdbc:h2:mem:productdb
    driverClassName: org.h2.Driver
    username: sa
    password: