server:
  port: 8082

spring:
  application:
    name: product-service

  # ─── COMPATIBILITÉ ET CONFIGURATION DE BASE CONSUL ───
  cloud:
    compatibility-verifier:
      enabled: false
    consul:
      host: localhost
      port: 8500
      discovery:
        instance-id: ${spring.application.name}-v4-${random.value}
        prefer-ip-address: true
        ip-address: 127.0.0.1    # ON FORCE LOCALHOST ICI !

  # ─── INITIALISATION SQL (Optionnel si vide) ───
  sql:
    init:
      mode: never #on le passe a never pour laisser Hibernate créer les tables d'abord

  # ─── CONFIGURATION BASE DE DONNÉES ET JPA ───
  datasource:
    url: jdbc:mysql://localhost:3310/cafe_velours_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: password # 💡 On met aussi "password" ici !
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect