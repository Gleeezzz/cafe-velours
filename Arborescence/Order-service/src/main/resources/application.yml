server:
  port: 8081 # Ou le port dédié à votre service Order

spring:
  application:
    name: order-service

  # 🗄️ CONFIGURATION DE LA BASE DE DONNÉES (CORRIGÉE)
  datasource:
    # On cible localhost avec le port externe 3310 défini dans votre Docker Compose
    url: jdbc:mysql://localhost:3310/cafe_velours_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  # 🔗 CONFIGURATION CONSUL POUR L'HÔTE
  cloud:
    compatibility-verifier:
      enabled: false
    consul:
      host: localhost
      port: 8500
      discovery:
        instance-id: ${spring.application.name}-v4-${random.value}
        prefer-ip-address: true
        ip-address: ${spring.cloud.client.ip-address}
        health-check-path: /actuator/health
        health-check-interval: 10s