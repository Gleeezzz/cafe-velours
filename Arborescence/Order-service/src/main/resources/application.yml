server:
  port: 8083

spring:
  application:
    name: order-service

  # ─── CONFIGURATION BASE DE DONNÉES ET JPA ───
  jpa:
    defer-datasource-initialization: true
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  datasource:
    url: jdbc:h2:mem:orderdb
    driverClassName: org.h2.Driver
    username: sa
    password:

  # ─── CONFIGURATION SPRING CLOUD & CONSUL ───
  cloud:
    compatibility-verifier:
      enabled: false
    consul:
      host: localhost
      port: 8500
      discovery:
        instance-id: ${spring.application.name}-v4-${random.value}
        prefer-ip-address: true
        ip-address: 127.0.0.1    # ON FORCE LOCALHOST ICI !