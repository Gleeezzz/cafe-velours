server:
  port: 8081

spring:
  application:
    name: order-service

  # ─── COMPATIBILITÉ ET CONFIGURATION DE BASE CONSUL ───
  cloud:
    compatibility-verifier:
      enabled: false
    consul:
      host: localhost
      port: 8500
      discovery:
        instance-id: ${spring.application.name}-v4-${random.value}
        prefer-ip-address: true
        ip-address: 127.0.0.1

  # ─── INITIALISATION SQL ───
  sql:
    init:
      mode: always

  # ─── CONFIGURATION BASE DE DONNÉES ET JPA ───
  datasource:
    url: jdbc:mysql://localhost:3310/cafe_velours_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  # ─── 🌟 AJOUT DE LA CONNEXION MONGODB NOSQL (COMPASS) ───
  data:
    mongodb:
      uri: mongodb://localhost:27017/cafe-velours-mongo